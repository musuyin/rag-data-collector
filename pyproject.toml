[project]
name = "drone-data-collector"
version = "0.1.0"
description = "Traceable collection, validation, provenance, and governance tooling for drone research data."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "certifi>=2024.12.14",
  "fastapi>=0.162.0",
  "jsonschema>=4.26.0",
  "lancedb>=0.40.0",
  "pyarrow>=26.0.0",
  "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "ruff>=0.8.0",
]

[tool.uv]
# This repository is executed through scripts/ rather than installed as a Python package.
package = false
cache-dir = ".uv-cache"

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [
  "data",
  "datasets",
  "fixtures",
]

[tool.ruff.lint]
# Existing operational scripts intentionally use compact one-line guards; enforce
# correctness, import order, and modern-Python rewrites without style-only churn.
select = ["F", "I", "UP"]
